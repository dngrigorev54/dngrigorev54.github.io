<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="keywords"
        content="Дмитрий Григорьев, фронтенд разработчик, веб-разработчик Новосибирск, создание сайтов, разработка лэндингов, доработка сайтов, спасение сайтов после взлома, лечение сайтов от вирусов, WordPress разработчик, Tilda разработчик, MODx разработчик, Moguta разработчик, вёрстка сайтов, адаптивная вёрстка, кроссбраузерная вёрстка, HTML CSS JavaScript, PHP разработчик, SEO оптимизация, настройка бэкапов, восстановление сайта, самозанятый разработчик, ИИ-агенты в разработке, разработка под ключ, поддержка сайтов, Новосибирск веб-разработка">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:locale" content="ru_RU">

    <link rel="icon" type="image/svg+xml" href="{{ '/img/favicon/favicon.svg' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/img/favicon/favicon.ico' | relative_url }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?=v2' | relative_url }}">

    {% seo %}
    {% feed_meta %}
</head>
