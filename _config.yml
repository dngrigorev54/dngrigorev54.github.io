title: "Дмитрий Григорьев · Разработка и спасение сайтов"
description: "15 лет разрабатываю и спасаю сайты на WordPress, 1C-Bitrix, Tilda и MODx."
author: "Дмитрий Григорьев"
lang: ru
url: "https://grigorev54.ru"
baseurl: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

collections:
  - blog

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Навигация (вынесено в data-файл ниже, но можно и здесь)
